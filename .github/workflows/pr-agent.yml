name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr_agent_job:
    name: AI pull request review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check PR Agent configuration
        id: config
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        shell: bash
        run: |
          if [[ -n "$OPENAI_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR Agent is disabled. Configure the OPENAI_KEY repository secret."
          fi
      - name: Review and describe pull request
        if: steps.config.outputs.enabled == 'true'
        uses: The-PR-Agent/pr-agent@v0.48.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "synchronize", "reopened", "ready_for_review", "review_requested"]'
          pr_reviewer.extra_instructions: >-
            Enforce the Clean Architecture dependency rules and research claim
            boundaries documented in AGENTS.md and docs/03-related-work-and-claim-boundary.md.
